<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoxTrack Results</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#050505;--surface:#0d0d10;--surface2:#141418;--surface3:#1a1a1e;
--text:#f0f0f0;--muted:#8a8a95;--dim:#55555f;
--accent:#f5c518;--accent-dim:rgba(245,197,24,0.12);
--run:#22c55e;--run-dim:rgba(34,197,94,0.08);
--station:#f97316;--station-dim:rgba(249,115,22,0.08);
--roxzone:#eab308;--roxzone-dim:rgba(234,179,8,0.08);
--hr-red:#ef4444;--border:#1a1a20;--border-light:#242430;
--pace:#60a5fa;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
.page{max-width:540px;margin:0 auto;padding:24px 16px 72px;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── Header ───────────────────────────────────── */
.header{text-align:center;margin-bottom:24px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:6px;color:var(--accent);opacity:.7}
.race-info{color:var(--muted);font-size:13px;margin-top:6px}
.race-date{color:var(--muted);font-size:12px;margin-top:2px}

/* ── Total time ───────────────────────────────── */
.total-block{text-align:center;margin-bottom:20px;padding:20px 16px 16px}
.total-time{font-family:'Bebas Neue',sans-serif;font-size:80px;color:var(--text);line-height:1;letter-spacing:4px}
.total-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:3px;margin-top:4px}

/* ── Stats strip ──────────────────────────────── */
.stats-strip{display:flex;gap:2px;margin-bottom:24px;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.stat-cell{flex:1;padding:12px 6px;text-align:center;position:relative}
.stat-cell:not(:last-child)::after{content:'';position:absolute;right:0;top:20%;bottom:20%;width:1px;background:var(--border-light)}
.stat-icon{width:22px;height:22px;margin:0 auto 4px;display:block;object-fit:contain}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.5px;line-height:1.2}
.stat-sub{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.c-run{color:var(--run)}.c-station{color:var(--station)}.c-roxzone{color:var(--roxzone)}
.c-pace{color:var(--pace)}.c-hr{color:var(--hr-red)}.c-warmup{color:var(--muted)}

/* ── Paired segment grid ──────────────────────── */
.seg-grid{display:flex;flex-direction:column;gap:3px;margin-bottom:24px}
.seg-row{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.seg-row.single{grid-template-columns:1fr}
.seg-cell{background:var(--surface);border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border)}
.seg-cell.run{border-left:3px solid var(--run)}
.seg-cell.station{border-left:3px solid var(--station)}
.seg-cell.roxzone{border-left:3px solid var(--roxzone)}
.seg-left{display:flex;flex-direction:column;min-width:0}
.seg-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-name.run{color:var(--run)}.seg-name.station{color:var(--station)}.seg-name.roxzone{color:var(--roxzone)}
.seg-detail{font-size:10px;color:var(--dim);margin-top:1px}
.seg-right{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
.seg-time{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.5px;color:var(--text)}
.seg-hr{font-size:10px;color:var(--hr-red);margin-top:1px;opacity:.8}

/* ── Buttons ──────────────────────────────────── */
.actions{display:flex;gap:10px;margin-top:28px}
.btn{flex:1;padding:14px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s ease}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--accent);color:#000}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border-light)}

/* ── Footer ───────────────────────────────────── */
.footer{text-align:center;margin-top:32px;padding-top:16px;border-top:1px solid var(--border)}
.footer-text{font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}

/* ── Empty / Error ────────────────────────────── */
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty h2{color:var(--text);margin-bottom:12px;font-size:20px}

/* ── Share Image Modal ────────────────────────── */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--surface2);border-radius:16px;border:1px solid var(--border-light);padding:28px 24px;max-width:360px;width:90%;animation:fadeUp .3s ease}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);letter-spacing:2px;text-align:center;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:20px}
.modal-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.modal-input{width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--border-light);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.modal-input:focus{border-color:var(--accent)}
.modal-input::placeholder{color:var(--dim)}
.modal-buttons{display:flex;gap:10px;margin-top:20px}
.modal-btn{flex:1;padding:14px 8px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s ease}
.modal-btn:active{transform:scale(0.97)}
.modal-btn-story{background:var(--accent);color:#000}
.modal-btn-post{background:var(--surface);color:var(--text);border:1px solid var(--border-light)}
.tpl-picker{display:flex;gap:8px;margin-bottom:16px;margin-top:6px}
.tpl-btn{flex:1;padding:10px 8px;border:2px solid var(--border-light);border-radius:10px;background:var(--surface);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s ease;text-transform:uppercase;letter-spacing:1px}
.tpl-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px}

/* ── Print ────────────────────────────────────── */
@media print{
body{background:#fff;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{padding:8px;max-width:100%}
.actions,.footer,.modal-overlay{display:none!important}
.total-time{color:#111}
.seg-cell{background:#f5f5f5;border-color:#ddd}
.seg-name.run{color:#16a34a}.seg-name.station{color:#c2410c}
.seg-hr{color:#b91c1c}
.logo{color:#b8960f}
}
</style>
</head>
<body>
<div class="page" id="page">
<div class="header">
    <div class="logo"><img src="https://raw.githubusercontent.com/jmferdin-spec/FerdinLabs/main/images/RoxTrack_Logo.png" alt="RoxTrack" style="height:60px"></div>
</div>
<div id="content"></div>
</div>

<!-- Share Image Modal -->
<div class="modal-overlay" id="shareModal" onclick="if(event.target===this)closeShareModal()">
<div class="modal" style="position:relative">
<button class="modal-close" onclick="closeShareModal()">&times;</button>
<div class="modal-title">Share Image</div>
<div class="modal-sub">Download a shareable card for Instagram</div>
<div class="modal-label">Template</div>
<div class="tpl-picker">
<button class="tpl-btn active" id="tplClassic" onclick="pickTemplate('classic')">Classic</button>
<button class="tpl-btn" id="tplSplits" onclick="pickTemplate('splits')">Splits</button>
</div>
<div class="modal-label">Race Name (optional)</div>
<input type="text" class="modal-input" id="raceNameInput" placeholder="e.g. Houston HYROX Open" maxlength="40">
<div class="modal-label" style="margin-top:16px">Background</div>
<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;margin-top:6px">
<span style="font-size:11px;color:var(--muted);white-space:nowrap">Transparent</span>
<input type="range" id="bgOpacitySlider" min="0" max="100" value="100" style="flex:1;accent-color:var(--accent);cursor:pointer" oninput="document.getElementById('bgOpacityVal').textContent=this.value+'%'">
<span id="bgOpacityVal" style="font-size:11px;color:var(--muted);min-width:32px;text-align:right">100%</span>
</div>
<div class="modal-buttons">
<button class="modal-btn modal-btn-story" onclick="generateShareImage('story')">Story 9:16</button>
<button class="modal-btn modal-btn-post" onclick="generateShareImage('post')">Post 1:1</button>
</div>
</div>
</div>

<canvas id="shareCanvas" style="display:none"></canvas>
<script>
function fmt(sec) {
    if (sec < 0) sec = 0;
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function fmtPace(sec, distM) {
    if (!distM || distM < 10) return '—';
    var pacePerKm = sec / (distM / 1000);
    var pm = Math.floor(pacePerKm / 60);
    var ps = Math.round(pacePerKm % 60);
    if (ps === 60) { pm++; ps = 0; }
    return pm + ':' + String(ps).padStart(2, '0') + '/km';
}

function fmtDate(unixSec) {
    if (!unixSec) return null;
    var d = new Date(unixSec * 1000);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function fmtDateLong(unixSec) {
    if (!unixSec) return null;
    var d = new Date(unixSec * 1000);
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var h = d.getHours();
    var m = String(d.getMinutes()).padStart(2, '0');
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ' · ' + h + ':' + m + ' ' + ampm;
}

var API_BASE = 'https://roxtrack-api.jmferdin.workers.dev';
var shareData = null;

// Pre-load logo and icons for share images
var logoImg = new Image();
logoImg.crossOrigin = 'anonymous';
logoImg.src = 'https://raw.githubusercontent.com/jmferdin-spec/FerdinLabs/main/images/RoxTrack.png';

var iconImgs = {};
var iconSrcs = {
    run: 'https://raw.githubusercontent.com/jmferdin-spec/FerdinLabs/main/images/runs.png',
    station: 'https://raw.githubusercontent.com/jmferdin-spec/FerdinLabs/main/images/stations.png',
    stopwatch: 'https://raw.githubusercontent.com/jmferdin-spec/FerdinLabs/main/images/roxzone.png',
    pace: 'https://raw.githubusercontent.com/jmferdin-spec/FerdinLabs/main/images/pace.png',
    heart: 'https://raw.githubusercontent.com/jmferdin-spec/FerdinLabs/main/images/hr.png'
};
for (var ik in iconSrcs) {
    iconImgs[ik] = new Image();
    iconImgs[ik].crossOrigin = 'anonymous';
    iconImgs[ik].src = iconSrcs[ik];
}

function init() {
    var p = new URLSearchParams(window.location.search);
    var el = document.getElementById('content');

    var hash = window.location.hash.substring(1);
    var id = hash || p.get('id');

    if (id) {
        el.innerHTML = '<div class="empty"><p>Loading results…</p></div>';
        fetch(API_BASE + '/result/' + encodeURIComponent(id))
            .then(function(res) {
                if (!res.ok) throw new Error('Race not found');
                return res.json();
            })
            .then(function(json) {
                if (!json.success || !json.data) throw new Error('Invalid response');
                renderRace(json.data, el);
            })
            .catch(function(err) {
                el.innerHTML = '<div class="empty"><h2>Error</h2><p>' + err.message + '</p></div>';
            });
        return;
    }

    try {
        var d = {
            t: parseInt(p.get('t')) || 0,
            w: parseInt(p.get('w')) || 0,
            r: parseInt(p.get('r')) || 0,
            s: parseInt(p.get('s')) || 0,
            z: parseInt(p.get('z')) || 0,
            p: parseInt(p.get('p')) || 100,
            rz: parseInt(p.get('rz')) || 0,
            l: p.get('l') || '',
            dt: parseInt(p.get('dt')) || 0
        };
        if (!d.t && !d.l) {
            el.innerHTML = '<div class="empty"><h2>No Data</h2><p>This page receives results from the RoxTrack watch app.<br>Use Share Results after completing a race.</p></div>';
            return;
        }
        renderRace(d, el);
    } catch (e) {
        el.innerHTML = '<div class="empty"><h2>Error</h2><p>' + e.message + '</p></div>';
    }
}

function renderRace(d, el) {
    var t = d.t || 0;
    var w = d.w || 0;
    var r = d.r || 0;
    var s = d.s || 0;
    var z = d.z || 0;
    var pct = d.p || 100;
    var rz = d.rz || 0;
    var lapsStr = d.l || '';
    var dt = d.dt || 0;

    // Compute avg run pace + avg HR from lap data
    var totalRunSec = 0, totalRunDist = 0;
    var hrSum = 0, hrCount = 0;
    var parsedLaps = [];
    if (lapsStr) {
        var rawLaps = lapsStr.split('|');
        for (var i = 0; i < rawLaps.length; i++) {
            var rp = rawLaps[i].split('^');
            var lap = {
                name: decodeURIComponent(rp[0] || '').replace(/\+/g, ' '),
                dur: parseInt(rp[1]) || 0,
                hr: parseInt(rp[2]) || 0,
                type: isNaN(parseInt(rp[3])) ? 2 : parseInt(rp[3]),
                dist: parseInt(rp[4]) || 0
            };
            parsedLaps.push(lap);
            if (lap.type === 0) {
                totalRunSec += lap.dur;
                totalRunDist += lap.dist;
            }
            if (lap.hr > 0) { hrSum += lap.hr; hrCount++; }
        }
    }

    var avgPaceStr = totalRunDist > 10 ? fmtPace(totalRunSec, totalRunDist) : '—';
    var avgHr = hrCount > 0 ? Math.round(hrSum / hrCount) : 0;

    var html = '';

    // Race info line
    var pctLabel = pct === 100 ? '100%' : pct + '%';
    html += '<div class="race-info">' + pctLabel + ' Distance</div>';

    // Date
    var dateDisplay = dt ? fmtDate(dt) : null;
    var dateLong = dt ? fmtDateLong(dt) : null;
    if (dateDisplay) {
        html += '<div class="race-date">' + dateDisplay + '</div>';
    }

    // Big total time
    html += '<div class="total-block">';
    html += '<div class="total-time">' + fmt(t) + '</div>';
    html += '<div class="total-label">Total Time</div>';
    html += '</div>';

    // Stats strip — horizontal row
    html += '<div class="stats-strip">';
    html += '<div class="stat-cell"><img class="stat-icon" src="https://raw.githubusercontent.com/jmferdin-spec/FerdinLabs/main/images/runs.png" alt=""><div class="stat-val c-run">' + fmt(r) + '</div><div class="stat-sub">Runs</div></div>';
    html += '<div class="stat-cell"><img class="stat-icon" src="https://raw.githubusercontent.com/jmferdin-spec/FerdinLabs/main/images/stations.png" alt=""><div class="stat-val c-station">' + fmt(s) + '</div><div class="stat-sub">Stations</div></div>';
    if (rz) {
        html += '<div class="stat-cell"><img class="stat-icon" src="https://raw.githubusercontent.com/jmferdin-spec/FerdinLabs/main/images/roxzone.png" alt=""><div class="stat-val c-roxzone">' + fmt(z) + '</div><div class="stat-sub">RoxZone</div></div>';
    }
    html += '<div class="stat-cell"><img class="stat-icon" src="https://raw.githubusercontent.com/jmferdin-spec/FerdinLabs/main/images/pace.png" alt=""><div class="stat-val c-pace">' + avgPaceStr + '</div><div class="stat-sub">Avg Pace</div></div>';
    html += '<div class="stat-cell"><img class="stat-icon" src="https://raw.githubusercontent.com/jmferdin-spec/FerdinLabs/main/images/hr.png" alt=""><div class="stat-val c-hr">' + (avgHr > 0 ? avgHr : '—') + '</div><div class="stat-sub">Avg HR</div></div>';
    html += '</div>';

    // Paired segment grid
    if (parsedLaps.length > 0) {
        html += '<div class="seg-grid">';

        // Each segment paired with its following roxzone
        var li = 0;
        while (li < parsedLaps.length) {
            var lap1 = parsedLaps[li];
            var cls1 = lap1.type === 0 ? 'run' : lap1.type === 1 ? 'roxzone' : 'station';
            var detail1 = '';
            if (lap1.type === 0 && lap1.dist > 0) {
                detail1 = (lap1.dist >= 1000) ? (lap1.dist / 1000) + 'km' : lap1.dist + 'm';
                var pace1 = fmtPace(lap1.dur, lap1.dist);
                if (pace1 && pace1 !== '—') detail1 = detail1 + ' · ' + pace1;
            }

            var next = (li + 1 < parsedLaps.length) ? parsedLaps[li + 1] : null;
            if (next && next.type === 1) {
                // Pair this segment with its following roxzone
                html += '<div class="seg-row">';
                html += buildSegCell(lap1, cls1, detail1);
                html += buildSegCell(next, 'roxzone', '');
                html += '</div>';
                li += 2;
            } else if (next && lap1.type === 0 && next.type === 2) {
                // No roxzones — pair run + station side by side
                html += '<div class="seg-row">';
                html += buildSegCell(lap1, 'run', detail1);
                html += buildSegCell(next, 'station', '');
                html += '</div>';
                li += 2;
            } else {
                // Standalone segment
                html += '<div class="seg-row single">';
                html += buildSegCell(lap1, cls1, detail1);
                html += '</div>';
                li++;
            }
        }
        html += '</div>';
    }

    html += '<div class="actions">';
    html += '<button class="btn btn-primary" onclick="openShareModal()">Share Image</button>';
    html += '<button class="btn btn-secondary" onclick="doShare()">Share Link</button>';
    html += '</div>';

    html += '<div class="footer"><div class="footer-text">Recorded with RoxTrack for Garmin</div></div>';

    el.innerHTML = html;

    // Store data for share image generation
    shareData = {
        total: fmt(t),
        warmup: fmt(w),
        run: fmt(r),
        station: fmt(s),
        roxzone: rz ? fmt(z) : null,
        pct: pct,
        avgPace: avgPaceStr,
        date: dateDisplay,
        dateLong: dateLong,
        avgHr: avgHr,
        laps: parsedLaps
    };
}

function buildSegCell(lap, cls, detail) {
    var h = '<div class="seg-cell ' + cls + '">';
    h += '<div class="seg-left">';
    h += '<div class="seg-name ' + cls + '">' + lap.name + '</div>';
    if (detail) h += '<div class="seg-detail">' + detail + '</div>';
    h += '</div>';
    h += '<div class="seg-right">';
    h += '<div class="seg-time">' + fmt(lap.dur) + '</div>';
    if (lap.hr > 0) h += '<div class="seg-hr">♥ ' + lap.hr + '</div>';
    h += '</div>';
    h += '</div>';
    return h;
}

function doShare() {
    if (navigator.share) {
        navigator.share({ title: 'RoxTrack Results', url: window.location.href });
    } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link copied to clipboard');
    }
}

// ── Share Image Modal ─────────────────────────────────────────────
function openShareModal() {
    document.getElementById('shareModal').classList.add('active');
    document.getElementById('raceNameInput').focus();
}
function closeShareModal() {
    document.getElementById('shareModal').classList.remove('active');
}

var selectedTemplate = 'classic';
function pickTemplate(tpl) {
    selectedTemplate = tpl;
    document.getElementById('tplClassic').classList.toggle('active', tpl === 'classic');
    document.getElementById('tplSplits').classList.toggle('active', tpl === 'splits');
}

// ── Shared canvas helpers ────────────────────────────────────────
var COL_BG      = '#0a0a0c';
var COL_GOLD    = '#f5c518';
var COL_WHITE   = '#f0f0f0';
var COL_MUTED   = '#888888';
var COL_DIM     = '#444444';
var COL_RUN     = '#22c55e';
var COL_STATION = '#f97316';
var COL_ROXZONE = '#eab308';
var COL_PACE    = '#60a5fa';
var COL_HR      = '#ef4444';
var COL_SURFACE = 'rgba(255,255,255,0.04)';
var COL_BORDER  = 'rgba(255,255,255,0.06)';

function segColor(type) {
    return type === 0 ? COL_RUN : type === 1 ? COL_ROXZONE : COL_STATION;
}

// ── Canvas Share Image Generator (Classic) ───────────────────────
function generateShareImage(mode) {
    if (!shareData) return;
    var raceName = document.getElementById('raceNameInput').value.trim();
    if (selectedTemplate === 'splits') {
        generateSplitsImage(mode, raceName);
        return;
    }

    var canvas = document.getElementById('shareCanvas');
    var isStory = (mode === 'story');
    var W = 1080;
    var H = isStory ? 1920 : 1080;
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext('2d');
    var bgOpacity = parseInt(document.getElementById('bgOpacitySlider').value, 10) / 100;

    // Gray gradient background (with opacity)
    ctx.clearRect(0, 0, W, H);
    if (bgOpacity > 0) {
        ctx.globalAlpha = bgOpacity;
        var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0, '#2a2a2e');
        bgGrad.addColorStop(0.5, '#1a1a1e');
        bgGrad.addColorStop(1, '#101014');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
    }

    function drawCenter(text, y, font, color) {
        ctx.font = font;
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.fillText(text, W / 2, y);
    }

    function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    // ── Draw icons for stat boxes ──
    function drawIcon(iconType, cx, cy, sz, color) {
        var r = sz / 2;
        ctx.save();
        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(2, sz * 0.09);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        switch (iconType) {
            case 'run':
                ctx.beginPath(); ctx.arc(cx + r*0.1, cy - r*0.5, r*0.16, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(cx, cy - r*0.3); ctx.lineTo(cx - r*0.08, cy + r*0.12); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx - r*0.08, cy + r*0.12); ctx.lineTo(cx + r*0.3, cy + r*0.5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx - r*0.08, cy + r*0.12); ctx.lineTo(cx - r*0.35, cy + r*0.5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx - r*0.25, cy - r*0.3); ctx.lineTo(cx, cy - r*0.12); ctx.lineTo(cx + r*0.3, cy - r*0.28); ctx.stroke();
                break;
            case 'station':
                var bw = r * 0.14;
                ctx.fillRect(cx - r*0.5, cy - bw/2, r, bw);
                ctx.fillRect(cx - r*0.65, cy - r*0.32, r*0.22, r*0.64);
                ctx.fillRect(cx + r*0.43, cy - r*0.32, r*0.22, r*0.64);
                break;
            case 'stopwatch':
                ctx.beginPath(); ctx.arc(cx, cy + r*0.06, r*0.4, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, cy - r*0.34); ctx.lineTo(cx, cy - r*0.58); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx - r*0.12, cy - r*0.62); ctx.lineTo(cx + r*0.12, cy - r*0.62); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, cy + r*0.06); ctx.lineTo(cx + r*0.2, cy - r*0.15); ctx.stroke();
                break;
            case 'pace':
                ctx.beginPath(); ctx.arc(cx, cy + r*0.12, r*0.42, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
                var na = Math.PI * 1.42;
                ctx.lineWidth = Math.max(2.5, sz * 0.1);
                ctx.beginPath(); ctx.moveTo(cx, cy + r*0.12); ctx.lineTo(cx + Math.cos(na)*r*0.28, cy + r*0.12 + Math.sin(na)*r*0.28); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx, cy + r*0.12, r*0.06, 0, Math.PI*2); ctx.fill();
                break;
            case 'heart':
                var hs = r * 0.48;
                ctx.beginPath();
                ctx.moveTo(cx, cy + hs*0.75);
                ctx.bezierCurveTo(cx - hs*1.4, cy + hs*0.05, cx - hs*0.75, cy - hs*1.15, cx, cy - hs*0.35);
                ctx.bezierCurveTo(cx + hs*0.75, cy - hs*1.15, cx + hs*1.4, cy + hs*0.05, cx, cy + hs*0.75);
                ctx.fill();
                break;
        }
        ctx.restore();
    }

    // ── Draw stat strip with icons ──
    function drawStatStrip(y, stripH) {
        var mx = 60;
        var sw = W - mx * 2;
        roundRect(mx, y, sw, stripH, 12);
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        ctx.stroke();

        var items = [
            { val: shareData.run, label: 'RUNS', color: COL_RUN, icon: 'run' },
            { val: shareData.station, label: 'STATIONS', color: COL_STATION, icon: 'station' }
        ];
        if (shareData.roxzone) items.push({ val: shareData.roxzone, label: 'ROXZONE', color: COL_ROXZONE, icon: 'stopwatch' });
        items.push({ val: shareData.avgPace, label: 'AVG PACE', color: COL_PACE, icon: 'pace' });
        items.push({ val: avgHr > 0 ? String(shareData.avgHr) : '—', label: 'AVG HR', color: COL_HR, icon: 'heart' });

        var cellW = sw / items.length;
        var iconSz = Math.round(stripH * 0.28);
        var valSize = Math.round(stripH * 0.24);
        var lblSize = Math.round(stripH * 0.11);

        for (var i = 0; i < items.length; i++) {
            var cx = mx + cellW * i + cellW / 2;
            var icoImg = iconImgs[items[i].icon];
            if (icoImg && icoImg.complete && icoImg.naturalWidth > 0) {
                var iw = iconSz, ih = iconSz;
                if (icoImg.naturalWidth > icoImg.naturalHeight) {
                    ih = iconSz * (icoImg.naturalHeight / icoImg.naturalWidth);
                } else if (icoImg.naturalHeight > icoImg.naturalWidth) {
                    iw = iconSz * (icoImg.naturalWidth / icoImg.naturalHeight);
                }
                ctx.drawImage(icoImg, cx - iw / 2, y + stripH * 0.22 - ih / 2, iw, ih);
            } else {
                drawIcon(items[i].icon, cx, y + stripH * 0.22, iconSz, items[i].color);
            }
            ctx.font = '700 ' + valSize + 'px sans-serif';
            ctx.fillStyle = items[i].color;
            ctx.textAlign = 'center';
            ctx.fillText(items[i].val, cx, y + stripH * 0.58);
            ctx.font = '500 ' + lblSize + 'px sans-serif';
            ctx.fillStyle = COL_DIM;
            ctx.letterSpacing = '2px';
            ctx.fillText(items[i].label, cx, y + stripH * 0.78);
            ctx.letterSpacing = '0px';

            if (i < items.length - 1) {
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(mx + cellW * (i + 1), y + stripH * 0.1);
                ctx.lineTo(mx + cellW * (i + 1), y + stripH * 0.9);
                ctx.stroke();
            }
        }
    }

    var laps = shareData.laps;
    var avgHr = shareData.avgHr;

    if (isStory) {
        // ── STORY 1080x1920 — totals centered ──
        var midY = H / 2;

        // Race name (replaces logo at top)
        var displayName = raceName ? raceName.toUpperCase() : 'HYROX';
        ctx.letterSpacing = '8px';
        drawCenter(displayName, midY - 280, '700 52px sans-serif', COL_WHITE);
        ctx.letterSpacing = '0px';

        // Distance label
        var distLabelC = shareData.pct === 100 ? '100% DISTANCE' : shareData.pct + '% DISTANCE';
        ctx.letterSpacing = '3px';
        drawCenter(distLabelC, midY - 242, '500 18px sans-serif', COL_DIM);
        ctx.letterSpacing = '0px';

        // Gold accent line
        ctx.fillStyle = COL_GOLD;
        ctx.fillRect(W / 2 - 35, midY - 232, 70, 3);

        // Date
        if (shareData.date) {
            drawCenter(shareData.date, midY - 185, '500 30px sans-serif', COL_WHITE);
        }

        // Big total time with shadow
        ctx.font = '800 200px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillText(shareData.total, W / 2 + 4, midY + 24);
        ctx.fillStyle = COL_WHITE;
        ctx.fillText(shareData.total, W / 2, midY + 20);

        // TOTAL TIME label
        ctx.letterSpacing = '10px';
        drawCenter('TOTAL TIME', midY + 70, '500 22px sans-serif', COL_MUTED);
        ctx.letterSpacing = '0px';

        // Distance %
        if (shareData.pct !== 100) {
            drawCenter(shareData.pct + '% Distance', midY + 100, '400 20px sans-serif', COL_DIM);
        }

        // Stat strip with icons
        drawStatStrip(midY + 130, 140);

        // "Tracked with" + small logo below stat strip
        var trackY = midY + 300;
        if (logoImg.complete && logoImg.naturalWidth > 0) {
            var flh = 22;
            var flw = flh * (logoImg.naturalWidth / logoImg.naturalHeight);
            var trackedText = 'TRACKED WITH';
            ctx.font = '500 14px sans-serif';
            ctx.letterSpacing = '3px';
            var tw = ctx.measureText(trackedText).width;
            var totalW = tw + 8 + flw;
            var startX = (W - totalW) / 2;
            ctx.fillStyle = COL_DIM;
            ctx.textAlign = 'left';
            ctx.fillText(trackedText, startX, trackY + flh / 2 + 5);
            ctx.letterSpacing = '0px';
            ctx.drawImage(logoImg, startX + tw + 8, trackY, flw, flh);
        } else {
            ctx.letterSpacing = '3px';
            drawCenter('TRACKED WITH ROXTRACK', trackY + 16, '500 14px sans-serif', COL_DIM);
            ctx.letterSpacing = '0px';
        }

    } else {
        // ── POST 1080x1080 — totals centered ──
        var midY2 = H / 2;

        // Race name (replaces logo at top)
        var displayName2 = raceName ? raceName.toUpperCase() : 'HYROX';
        ctx.letterSpacing = '6px';
        drawCenter(displayName2, midY2 - 220, '700 44px sans-serif', COL_WHITE);
        ctx.letterSpacing = '0px';

        // Distance label
        var distLabelC2 = shareData.pct === 100 ? '100% DISTANCE' : shareData.pct + '% DISTANCE';
        ctx.letterSpacing = '2px';
        drawCenter(distLabelC2, midY2 - 187, '500 14px sans-serif', COL_DIM);
        ctx.letterSpacing = '0px';

        // Gold accent line
        ctx.fillStyle = COL_GOLD;
        ctx.fillRect(W / 2 - 30, midY2 - 178, 60, 3);

        // Date
        if (shareData.date) {
            drawCenter(shareData.date, midY2 - 143, '500 26px sans-serif', COL_WHITE);
        }

        // Big total time with shadow
        ctx.font = '800 160px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillText(shareData.total, W / 2 + 3, midY2 + 13);
        ctx.fillStyle = COL_WHITE;
        ctx.fillText(shareData.total, W / 2, midY2 + 10);

        // TOTAL TIME label
        ctx.letterSpacing = '8px';
        drawCenter('TOTAL TIME', midY2 + 55, '500 18px sans-serif', COL_MUTED);
        ctx.letterSpacing = '0px';

        // Distance %
        if (shareData.pct !== 100) {
            drawCenter(shareData.pct + '% Distance', midY2 + 80, '400 18px sans-serif', COL_DIM);
        }

        // Stat strip with icons
        drawStatStrip(midY2 + 100, 120);

        // "Tracked with" + small logo below stat strip
        var trackY2 = midY2 + 245;
        if (logoImg.complete && logoImg.naturalWidth > 0) {
            var flh2 = 18;
            var flw2 = flh2 * (logoImg.naturalWidth / logoImg.naturalHeight);
            var trackedText2 = 'TRACKED WITH';
            ctx.font = '500 12px sans-serif';
            ctx.letterSpacing = '3px';
            var tw2 = ctx.measureText(trackedText2).width;
            ctx.letterSpacing = '0px';
            var totalW2 = tw2 + 8 + flw2;
            var startX2 = (W - totalW2) / 2;
            ctx.fillStyle = COL_DIM;
            ctx.textAlign = 'left';
            ctx.letterSpacing = '3px';
            ctx.fillText(trackedText2, startX2, trackY2 + flh2 / 2 + 4);
            ctx.letterSpacing = '0px';
            ctx.drawImage(logoImg, startX2 + tw2 + 8, trackY2, flw2, flh2);
        } else {
            ctx.letterSpacing = '3px';
            drawCenter('TRACKED WITH ROXTRACK', trackY2 + 14, '500 12px sans-serif', COL_DIM);
            ctx.letterSpacing = '0px';
        }
    }

    // Download
    canvas.toBlob(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'roxtrack-' + mode + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        closeShareModal();
    }, 'image/png');
}

// ── Splits Share Image Generator ─────────────────────────────────
function generateSplitsImage(mode, raceName) {
    var canvas = document.getElementById('shareCanvas');
    var isStory = (mode === 'story');
    var W = 1080;
    var H = isStory ? 1920 : 1080;
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext('2d');
    var bgOpacity = parseInt(document.getElementById('bgOpacitySlider').value, 10) / 100;

    // Gray gradient background (with opacity)
    ctx.clearRect(0, 0, W, H);
    if (bgOpacity > 0) {
        ctx.globalAlpha = bgOpacity;
        var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0, '#2a2a2e');
        bgGrad.addColorStop(0.5, '#1a1a1e');
        bgGrad.addColorStop(1, '#101014');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
    }

    function drawCenter(text, y, font, color) {
        ctx.font = font;
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.fillText(text, W / 2, y);
    }

    var laps = shareData.laps;
    var avgHr = shareData.avgHr;
    var maxDur = 0;
    for (var mi = 0; mi < laps.length; mi++) {
        if (laps[mi].dur > maxDur) maxDur = laps[mi].dur;
    }
    if (maxDur <= 0) maxDur = 1;

    var marginX = 60;
    var barMaxW = W - marginX * 2;

    // Group laps into rounds (each round starts with a run)
    var rounds = [];
    var curRound = null;
    for (var gi = 0; gi < laps.length; gi++) {
        if (laps[gi].type === 0) {
            if (curRound) rounds.push(curRound);
            curRound = [laps[gi]];
        } else if (curRound) {
            curRound.push(laps[gi]);
        } else {
            curRound = [laps[gi]];
        }
    }
    if (curRound) rounds.push(curRound);

    // Count runs/stations for header
    var numRuns = 0, numStations = 0;
    for (var ci = 0; ci < laps.length; ci++) {
        if (laps[ci].type === 0) numRuns++;
        if (laps[ci].type === 2) numStations++;
    }

    if (isStory) {
        // ── STORY 1080x1920 — branded splits ──
        var mx = 60;
        var contentLeft = 130;
        var barLeft = 300;
        var barRight = W - mx - 10;
        var barW_max = barRight - barLeft;
        var timeRight = W - mx;

        // Pre-compute segment list height for vertical centering
        var hasRoxzone = false;
        for (var rzi = 0; rzi < laps.length; rzi++) { if (laps[rzi].type === 1) { hasRoxzone = true; break; } }
        var roundGap = hasRoxzone ? 8 : 24;
        var totalRows = laps.length;
        var rowH = 38;
        if (rowH > 42) rowH = 42;
        if (rowH < 28) rowH = 28;
        var barH = 8;
        var segListH = totalRows * rowH + (rounds.length - 1) * roundGap;
        var baseY = Math.max(40, Math.round((H - 300 - segListH) / 2));

        // ── Header — race name (replaces logo) ──
        var displayNameSS = raceName ? raceName.toUpperCase() : 'HYROX';
        var titleY = baseY + 10;
        ctx.font = '800 56px sans-serif';
        ctx.fillStyle = COL_WHITE;
        ctx.textAlign = 'left';
        ctx.letterSpacing = '6px';
        ctx.fillText(displayNameSS, mx, titleY);
        ctx.letterSpacing = '0px';

        // Big total time with shadow
        ctx.font = '800 130px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillText(shareData.total, mx + 3, titleY + 133);
        ctx.fillStyle = COL_WHITE;
        ctx.fillText(shareData.total, mx, titleY + 130);

        ctx.font = '500 18px sans-serif';
        ctx.fillStyle = COL_MUTED;
        ctx.textAlign = 'left';
        ctx.letterSpacing = '6px';
        ctx.fillText('TOTAL TIME', mx, titleY + 158);
        ctx.letterSpacing = '0px';

        // Date + distance (right of total time)
        if (shareData.date) {
            ctx.font = '500 26px sans-serif';
            ctx.fillStyle = COL_WHITE;
            ctx.textAlign = 'right';
            ctx.fillText(shareData.date.toUpperCase(), timeRight, titleY + 95);
        }
        var distLabel = shareData.pct === 100 ? '100% DISTANCE' : shareData.pct + '% DISTANCE';
        ctx.font = '500 18px sans-serif';
        ctx.fillStyle = COL_DIM;
        ctx.textAlign = 'right';
        ctx.letterSpacing = '2px';
        ctx.fillText(distLabel, timeRight, titleY + 122);
        ctx.letterSpacing = '0px';

        // ── Stat boxes (horizontal strip below total) ──
        var stripY = titleY + 185;
        var stripH = 70;
        var statsItems = [
            { val: shareData.run, label: 'RUNS', color: COL_RUN },
            { val: shareData.station, label: 'STATIONS', color: COL_STATION },
            { val: shareData.avgPace, label: 'AVG PACE', color: COL_PACE },
            { val: avgHr > 0 ? String(shareData.avgHr) : '—', label: 'AVG HR', color: COL_HR }
        ];
        var stripW = timeRight - mx;
        var boxGap = 8;
        var boxW = (stripW - boxGap * (statsItems.length - 1)) / statsItems.length;
        for (var sti = 0; sti < statsItems.length; sti++) {
            var bx = mx + sti * (boxW + boxGap);
            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.fillRect(bx, stripY, boxW, stripH);
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(bx, stripY, boxW, stripH);
            ctx.font = '700 28px sans-serif';
            ctx.fillStyle = statsItems[sti].color;
            ctx.textAlign = 'center';
            ctx.fillText(statsItems[sti].val, bx + boxW / 2, stripY + stripH / 2 + 2);
            ctx.font = '500 12px sans-serif';
            ctx.fillStyle = COL_DIM;
            ctx.letterSpacing = '1px';
            ctx.fillText(statsItems[sti].label, bx + boxW / 2, stripY + stripH / 2 + 22);
            ctx.letterSpacing = '0px';
        }

        // ── Segment list by round ──
        var listTop = stripY + stripH + 24;

        var sy = listTop;
        for (var ri = 0; ri < rounds.length; ri++) {
            var round = rounds[ri];
            var roundMidY = sy + (round.length * rowH) / 2;

            // Round number on the left
            ctx.font = '700 36px sans-serif';
            ctx.fillStyle = COL_MUTED;
            ctx.textAlign = 'right';
            ctx.fillText(String(ri + 1).padStart(2, '0'), contentLeft - 20, roundMidY + 10);

            // Draw each segment in this round
            for (var si = 0; si < round.length; si++) {
                var seg = round[si];
                var rowY = sy + si * rowH;
                var col = segColor(seg.type);
                var bw = Math.max(4, Math.round(barW_max * seg.dur / maxDur));

                // Segment name
                ctx.font = '600 20px sans-serif';
                ctx.fillStyle = col;
                ctx.textAlign = 'left';
                ctx.fillText(seg.name, contentLeft, rowY + rowH / 2 + 2);

                // Proportional bar
                var barY = rowY + rowH / 2 + 8;
                ctx.fillStyle = 'rgba(255,255,255,0.04)';
                ctx.fillRect(contentLeft, barY, barW_max, barH);
                ctx.fillStyle = col;
                ctx.fillRect(contentLeft, barY, bw, barH);

                // Time
                ctx.font = '700 20px sans-serif';
                ctx.fillStyle = COL_WHITE;
                ctx.textAlign = 'right';
                ctx.fillText(fmt(seg.dur), timeRight, rowY + rowH / 2 + 2);
            }

            sy += round.length * rowH + roundGap;

            // Divider line between rounds
            if (ri < rounds.length - 1) {
                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(contentLeft, sy - 4);
                ctx.lineTo(timeRight, sy - 4);
                ctx.stroke();
            }
        }

        // ── Footer — small logo + "Tracked with" ──
        var footYS = baseY + 389 + segListH;
        if (logoImg.complete && logoImg.naturalWidth > 0) {
            var flhS = 20;
            var flwS = flhS * (logoImg.naturalWidth / logoImg.naturalHeight);
            ctx.font = '500 13px sans-serif';
            ctx.letterSpacing = '3px';
            ctx.fillStyle = COL_DIM;
            ctx.textAlign = 'left';
            ctx.fillText('TRACKED WITH', mx, footYS + 2);
            ctx.letterSpacing = '0px';
            var twS = ctx.measureText('TRACKED WITH').width;
            ctx.drawImage(logoImg, mx + twS + 10, footYS - 9, flwS, flhS);
        } else {
            ctx.font = '500 13px sans-serif';
            ctx.fillStyle = COL_DIM;
            ctx.textAlign = 'left';
            ctx.letterSpacing = '3px';
            ctx.fillText('TRACKED WITH ROXTRACK', mx, footYS + 2);
            ctx.letterSpacing = '0px';
        }

    } else {
        // ── POST 1080x1080 — compact branded splits ──
        var mx2 = 50;
        var contentLeft2 = 110;
        var barLeft2 = 260;
        var barRight2 = W - mx2 - 10;
        var barW_max2 = barRight2 - barLeft2;
        var timeRight2 = W - mx2;

        // Pre-compute for vertical centering
        var hasRoxzone2 = false;
        for (var rzi2 = 0; rzi2 < laps.length; rzi2++) { if (laps[rzi2].type === 1) { hasRoxzone2 = true; break; } }
        var roundGap2 = hasRoxzone2 ? 4 : 16;
        var totalRows2 = laps.length;
        var rowH2 = 26;
        var barH2 = 2;
        var segListH2 = totalRows2 * rowH2 + (rounds.length - 1) * roundGap2;
        var baseY2 = Math.round((H - 190 - segListH2) / 2);
        while (baseY2 < 30 && rowH2 > 20) {
            rowH2--;
            segListH2 = totalRows2 * rowH2 + (rounds.length - 1) * roundGap2;
            baseY2 = Math.round((H - 190 - segListH2) / 2);
        }
        if (baseY2 < 20) baseY2 = 20;

        // Header — race name (replaces logo)
        var displayNameSP = raceName ? raceName.toUpperCase() : 'HYROX';
        var ty2 = baseY2 + 10;
        ctx.font = '800 34px sans-serif';
        ctx.fillStyle = COL_WHITE;
        ctx.textAlign = 'left';
        ctx.letterSpacing = '4px';
        ctx.fillText(displayNameSP, mx2, ty2);
        ctx.letterSpacing = '0px';

        ctx.font = '800 68px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillText(shareData.total, mx2 + 2, ty2 + 70);
        ctx.fillStyle = COL_WHITE;
        ctx.fillText(shareData.total, mx2, ty2 + 68);
        ctx.font = '500 13px sans-serif';
        ctx.fillStyle = COL_MUTED;
        ctx.letterSpacing = '4px';
        ctx.fillText('TOTAL TIME', mx2, ty2 + 88);
        ctx.letterSpacing = '0px';

        // Date + distance (right of total time)
        if (shareData.date) {
            ctx.font = '500 22px sans-serif';
            ctx.fillStyle = COL_WHITE;
            ctx.textAlign = 'right';
            ctx.fillText(shareData.date.toUpperCase(), timeRight2, ty2 + 40);
        }
        var distLabel2 = shareData.pct === 100 ? '100% DISTANCE' : shareData.pct + '% DISTANCE';
        ctx.font = '500 14px sans-serif';
        ctx.fillStyle = COL_DIM;
        ctx.textAlign = 'right';
        ctx.letterSpacing = '2px';
        ctx.fillText(distLabel2, timeRight2, ty2 + 60);
        ctx.letterSpacing = '0px';

        // ── Stat boxes (side by side) ──
        var strip2Y = ty2 + 108;
        var strip2H = 55;
        var statsItems2 = [
            { val: shareData.run, label: 'RUNS', color: COL_RUN },
            { val: shareData.station, label: 'STATIONS', color: COL_STATION },
            { val: shareData.avgPace, label: 'AVG PACE', color: COL_PACE },
            { val: avgHr > 0 ? String(shareData.avgHr) : '—', label: 'AVG HR', color: COL_HR }
        ];
        var strip2W = timeRight2 - mx2;
        var boxGap2 = 6;
        var box2W = (strip2W - boxGap2 * (statsItems2.length - 1)) / statsItems2.length;
        for (var sti2 = 0; sti2 < statsItems2.length; sti2++) {
            var bx2 = mx2 + sti2 * (box2W + boxGap2);
            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.fillRect(bx2, strip2Y, box2W, strip2H);
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(bx2, strip2Y, box2W, strip2H);
            ctx.font = '700 22px sans-serif';
            ctx.fillStyle = statsItems2[sti2].color;
            ctx.textAlign = 'center';
            ctx.fillText(statsItems2[sti2].val, bx2 + box2W / 2, strip2Y + strip2H / 2 + 1);
            ctx.font = '500 10px sans-serif';
            ctx.fillStyle = COL_DIM;
            ctx.letterSpacing = '1px';
            ctx.fillText(statsItems2[sti2].label, bx2 + box2W / 2, strip2Y + strip2H / 2 + 17);
            ctx.letterSpacing = '0px';
        }

        // Segment list
        var listTop2 = strip2Y + strip2H + 16;

        var sy2 = listTop2;
        for (var ri2 = 0; ri2 < rounds.length; ri2++) {
            var round2 = rounds[ri2];
            var roundMidY2 = sy2 + (round2.length * rowH2) / 2;

            ctx.font = '700 24px sans-serif';
            ctx.fillStyle = COL_DIM;
            ctx.textAlign = 'right';
            ctx.fillText(String(ri2 + 1).padStart(2, '0'), contentLeft2 - 14, roundMidY2 + 6);

            for (var si2 = 0; si2 < round2.length; si2++) {
                var seg2 = round2[si2];
                var rowY2 = sy2 + si2 * rowH2;
                var col2 = segColor(seg2.type);
                var bw2 = Math.max(3, Math.round(barW_max2 * seg2.dur / maxDur));

                ctx.font = '600 15px sans-serif';
                ctx.fillStyle = col2;
                ctx.textAlign = 'left';
                ctx.fillText(seg2.name, contentLeft2, rowY2 + rowH2 / 2 + 1);

                var barY2 = rowY2 + rowH2 / 2 + 6;
                ctx.fillStyle = 'rgba(255,255,255,0.04)';
                ctx.fillRect(contentLeft2, barY2, barW_max2, barH2);
                ctx.fillStyle = col2;
                ctx.fillRect(contentLeft2, barY2, bw2, barH2);

                ctx.font = '700 15px sans-serif';
                ctx.fillStyle = COL_WHITE;
                ctx.textAlign = 'right';
                ctx.fillText(fmt(seg2.dur), timeRight2, rowY2 + rowH2 / 2 + 1);
            }

            sy2 += round2.length * rowH2 + roundGap2;

            // Divider line between rounds
            if (ri2 < rounds.length - 1) {
                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(contentLeft2, sy2 - 2);
                ctx.lineTo(timeRight2, sy2 - 2);
                ctx.stroke();
            }
        }

        // ── Footer — small logo + "Tracked with" ──
        var footYP = H - 40;
        if (logoImg.complete && logoImg.naturalWidth > 0) {
            var flhP = 16;
            var flwP = flhP * (logoImg.naturalWidth / logoImg.naturalHeight);
            ctx.font = '500 11px sans-serif';
            ctx.letterSpacing = '3px';
            ctx.fillStyle = COL_DIM;
            ctx.textAlign = 'left';
            ctx.fillText('TRACKED WITH', mx2, footYP + 2);
            ctx.letterSpacing = '0px';
            var twP = ctx.measureText('TRACKED WITH').width;
            ctx.drawImage(logoImg, mx2 + twP + 8, footYP - 7, flwP, flhP);
        } else {
            ctx.font = '500 11px sans-serif';
            ctx.fillStyle = COL_DIM;
            ctx.textAlign = 'left';
            ctx.letterSpacing = '3px';
            ctx.fillText('TRACKED WITH ROXTRACK', mx2, footYP + 2);
            ctx.letterSpacing = '0px';
        }
    }

    canvas.toBlob(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'roxtrack-splits-' + mode + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        closeShareModal();
    }, 'image/png');
}

init();
</script>
</body>
</html>
