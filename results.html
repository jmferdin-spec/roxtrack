<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoxTrack Results</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#050505;--surface:#111113;--surface2:#1a1a1e;--surface3:#222226;
--text:#f0f0f0;--muted:#8a8a95;--dim:#55555f;
--accent:#f5c518;--accent-dim:rgba(245,197,24,0.12);
--run:#22c55e;--run-dim:rgba(34,197,94,0.10);
--station:#f97316;--station-dim:rgba(249,115,22,0.10);
--roxzone:#eab308;--roxzone-dim:rgba(234,179,8,0.10);
--hr-red:#ef4444;--border:#1e1e24;--border-light:#2a2a32;
--pace:#60a5fa;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
.page{max-width:540px;margin:0 auto;padding:32px 16px 72px;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── Header ─────────────────────────────────────── */
.header{text-align:center;margin-bottom:32px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:4px;color:var(--accent);display:inline-block;position:relative}
.logo::after{content:'';position:absolute;bottom:-4px;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.4}
.subtitle{color:var(--muted);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-top:10px}
.race-date{color:var(--muted);font-size:13px;letter-spacing:0.5px;margin-top:12px}
.race-date span{color:var(--text);font-weight:600}

/* ── Total block ────────────────────────────────── */
.total-block{text-align:center;margin-bottom:20px;padding:28px 16px 24px;background:linear-gradient(145deg,var(--surface),var(--surface2));border-radius:16px;border:1px solid var(--border-light);position:relative;overflow:hidden}
.total-block::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.total-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:3px;margin-bottom:8px}
.total-time{font-family:'Bebas Neue',sans-serif;font-size:72px;color:var(--accent);line-height:1;letter-spacing:3px;text-shadow:0 0 40px rgba(245,197,24,0.15)}
.total-pct{font-size:12px;color:var(--dim);margin-top:8px}

/* ── Stat cards ─────────────────────────────────── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.stat{background:var(--surface);border-radius:12px;padding:16px;border:1px solid var(--border);position:relative;overflow:hidden;transition:border-color .2s}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:.6}
.stat.s-warmup::before{background:var(--muted)}
.stat.s-run::before{background:var(--run)}
.stat.s-station::before{background:var(--station)}
.stat.s-roxzone::before{background:var(--roxzone)}
.stat.s-pace::before{background:var(--pace)}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.stat-value{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px}
.c-run{color:var(--run)}.c-station{color:var(--station)}.c-roxzone{color:var(--roxzone)}.c-warmup{color:var(--muted)}.c-pace{color:var(--pace)}

/* ── Lap table ──────────────────────────────────── */
.section-hdr{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:3px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.lap-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:28px}
.lap-table th{text-align:left;font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;padding:8px 6px 12px;border-bottom:1px solid var(--border-light);font-weight:500}
.lap-table th:not(:first-child){text-align:right}
.lap-table td{padding:12px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.lap-table td:not(:first-child){text-align:right;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:0.5px}
.lap-table tr:last-child td{border-bottom:none}
.lap-table tr:hover td{background:var(--surface)}
.lap-name{font-weight:600;font-size:14px}
.lap-name.run{color:var(--run)}.lap-name.station{color:var(--station)}.lap-name.roxzone{color:var(--roxzone)}
.lap-hr{color:var(--hr-red)}
.lap-pace{color:var(--pace)}
.lap-dist{color:var(--dim)}
.lap-cumul{color:var(--dim);font-size:15px}

/* ── Buttons ────────────────────────────────────── */
.actions{display:flex;gap:10px;margin-top:32px}
.btn{flex:1;padding:15px;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s ease}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--accent);color:#000;box-shadow:0 4px 20px rgba(245,197,24,0.2)}
.btn-primary:hover{box-shadow:0 4px 28px rgba(245,197,24,0.3)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border-light)}
.btn-secondary:hover{border-color:var(--dim)}

/* ── Footer ─────────────────────────────────────── */
.footer{text-align:center;margin-top:36px;padding-top:20px;border-top:1px solid var(--border)}
.footer-text{font-size:11px;color:var(--dim);letter-spacing:1px}

/* ── Empty / Error ──────────────────────────────── */
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty h2{color:var(--text);margin-bottom:12px;font-size:20px}

/* ── Share Image Modal ─────────────────────────── */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--surface2);border-radius:16px;border:1px solid var(--border-light);padding:28px 24px;max-width:360px;width:90%;animation:fadeUp .3s ease}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);letter-spacing:2px;text-align:center;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:20px}
.modal-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.modal-input{width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--border-light);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.modal-input:focus{border-color:var(--accent)}
.modal-input::placeholder{color:var(--dim)}
.modal-buttons{display:flex;gap:10px;margin-top:20px}
.modal-btn{flex:1;padding:14px 8px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s ease}
.modal-btn:active{transform:scale(0.97)}
.modal-btn-story{background:var(--accent);color:#000}
.modal-btn-post{background:var(--surface);color:var(--text);border:1px solid var(--border-light)}
.modal-btn-post:hover{border-color:var(--dim)}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px}
.modal-close:hover{color:var(--text)}

/* ── Print ──────────────────────────────────────── */
@media print{
body{background:#fff;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{padding:8px;max-width:100%}
.actions,.footer,.modal-overlay{display:none!important}
.total-block,.stat{border-color:#ddd;background:#f8f8f8}
.total-block::before,.stat::before{display:none}
.total-time{color:#b8960f;text-shadow:none}
.lap-table th{color:#666;border-color:#ccc}
.lap-table td{border-color:#e0e0e0}
.lap-table tr:hover td{background:transparent}
.c-run,.lap-name.run{color:#16a34a}.c-station,.lap-name.station{color:#c2410c}
.c-roxzone,.lap-name.roxzone{color:#a16207}
.c-pace,.lap-pace{color:#2563eb}
.lap-hr{color:#b91c1c}
.section-hdr{color:#666;border-color:#ccc}
.logo{color:#b8960f}.logo::after{display:none}
}
</style>
</head>
<body>
<div class="page" id="page">
<div class="header">
    <div class="logo">ROXTRACK</div>
    <div class="subtitle">Race Results</div>
</div>
<div id="content"></div>
</div>

<!-- Share Image Modal -->
<div class="modal-overlay" id="shareModal" onclick="if(event.target===this)closeShareModal()">
<div class="modal" style="position:relative">
<button class="modal-close" onclick="closeShareModal()">&times;</button>
<div class="modal-title">Share Image</div>
<div class="modal-sub">Download a shareable card for Instagram</div>
<div class="modal-label">Race Name (optional)</div>
<input type="text" class="modal-input" id="raceNameInput" placeholder="e.g. Houston HYROX Open" maxlength="40">
<div class="modal-buttons">
<button class="modal-btn modal-btn-story" onclick="generateShareImage('story')">Story 9:16</button>
<button class="modal-btn modal-btn-post" onclick="generateShareImage('post')">Post 1:1</button>
</div>
</div>
</div>

<canvas id="shareCanvas" style="display:none"></canvas>
<script>
function fmt(sec) {
    if (sec < 0) sec = 0;
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function fmtPace(sec, distM) {
    if (!distM || distM < 10) return '—';
    var pacePerKm = sec / (distM / 1000);
    var pm = Math.floor(pacePerKm / 60);
    var ps = Math.round(pacePerKm % 60);
    if (ps === 60) { pm++; ps = 0; }
    return pm + ':' + String(ps).padStart(2, '0') + '/km';
}

function fmtDate(unixSec) {
    if (!unixSec) return null;
    var d = new Date(unixSec * 1000);
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var day = days[d.getDay()];
    var month = months[d.getMonth()];
    var date = d.getDate();
    var h = d.getHours();
    var m = String(d.getMinutes()).padStart(2, '0');
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return day + ', ' + month + ' ' + date + ' · ' + h + ':' + m + ' ' + ampm;
}

var API_BASE = 'https://roxtrack-api.jmferdin.workers.dev';
var shareData = null;  // populated by renderRace for share image

function init() {
    var p = new URLSearchParams(window.location.search);
    var el = document.getElementById('content');

    // Check hash fragment first (#abc123), then query param (?id=abc123)
    var hash = window.location.hash.substring(1);
    var id = hash || p.get('id');

    // New path: fetch from API by ID
    if (id) {
        el.innerHTML = '<div class="empty"><p>Loading results…</p></div>';
        fetch(API_BASE + '/result/' + encodeURIComponent(id))
            .then(function(res) {
                if (!res.ok) throw new Error('Race not found');
                return res.json();
            })
            .then(function(json) {
                if (!json.success || !json.data) throw new Error('Invalid response');
                renderRace(json.data, el);
            })
            .catch(function(err) {
                el.innerHTML = '<div class="empty"><h2>Error</h2><p>' + err.message + '</p></div>';
            });
        return;
    }

    // Legacy path: read data from URL params (backward compatibility)
    try {
        var d = {
            t: parseInt(p.get('t')) || 0,
            w: parseInt(p.get('w')) || 0,
            r: parseInt(p.get('r')) || 0,
            s: parseInt(p.get('s')) || 0,
            z: parseInt(p.get('z')) || 0,
            p: parseInt(p.get('p')) || 100,
            rz: parseInt(p.get('rz')) || 0,
            l: p.get('l') || '',
            dt: parseInt(p.get('dt')) || 0
        };
        if (!d.t && !d.l) {
            el.innerHTML = '<div class="empty"><h2>No Data</h2><p>This page receives results from the RoxTrack watch app.<br>Use Share Results after completing a race.</p></div>';
            return;
        }
        renderRace(d, el);
    } catch (e) {
        el.innerHTML = '<div class="empty"><h2>Error</h2><p>' + e.message + '</p></div>';
    }
}

function renderRace(d, el) {
    var t = d.t || 0;
    var w = d.w || 0;
    var r = d.r || 0;
    var s = d.s || 0;
    var z = d.z || 0;
    var pct = d.p || 100;
    var rz = d.rz || 0;
    var lapsStr = d.l || '';
    var dt = d.dt || 0;

    // ── Compute avg run pace from lap data ──────────────────────
    var totalRunSec = 0;
    var totalRunDist = 0;
    if (lapsStr) {
        var rawLaps = lapsStr.split('|');
        for (var ri = 0; ri < rawLaps.length; ri++) {
            var rp = rawLaps[ri].split('^');
            var rpType = parseInt(rp[3]);
            if (rpType === 0) {  // SEG_RUN
                totalRunSec  += parseInt(rp[1]) || 0;
                totalRunDist += parseInt(rp[4]) || 0;
            }
        }
    }

    var html = '';

    // Date/time line
    var dateDisplay = dt ? fmtDate(dt) : null;
    if (dateDisplay) {
        html += '<div class="race-date"><span>' + dateDisplay + '</span></div>';
    }

    html += '<div class="total-block">';
    html += '<div class="total-label">Race Time</div>';
    html += '<div class="total-time">' + fmt(t) + '</div>';
    if (pct !== 100) html += '<div class="total-pct">' + pct + '% Distance</div>';
    html += '</div>';

    html += '<div class="stats">';
    html += '<div class="stat s-warmup"><div class="stat-label">Warm Up</div><div class="stat-value c-warmup">' + fmt(w) + '</div></div>';
    html += '<div class="stat s-run"><div class="stat-label">Total Run</div><div class="stat-value c-run">' + fmt(r) + '</div></div>';
    html += '<div class="stat s-station"><div class="stat-label">Total Station</div><div class="stat-value c-station">' + fmt(s) + '</div></div>';

    // Avg Run Pace card
    var avgPaceStr = '—';
    if (totalRunDist > 10) {
        avgPaceStr = fmtPace(totalRunSec, totalRunDist);
    }
    html += '<div class="stat s-pace"><div class="stat-label">Avg Run Pace</div><div class="stat-value c-pace">' + avgPaceStr + '</div></div>';

    if (rz) html += '<div class="stat s-roxzone"><div class="stat-label">RoxZone</div><div class="stat-value c-roxzone">' + fmt(z) + '</div></div>';
    html += '</div>';

    if (lapsStr) {
        var laps = lapsStr.split('|');
        html += '<div class="section-hdr">Lap Breakdown</div>';
        html += '<table class="lap-table"><thead><tr>';
        html += '<th>Segment</th><th>Time</th><th>Cumul.</th><th>♥ Avg</th><th>Pace</th><th>Dist</th>';
        html += '</tr></thead><tbody>';

        var cumul = 0;
        for (var i = 0; i < laps.length; i++) {
            var parts = laps[i].split('^');
            var name = decodeURIComponent(parts[0] || '').replace(/\+/g, ' ');
            var dur = parseInt(parts[1]) || 0;
            var hr = parseInt(parts[2]) || 0;
            var tpRaw = parseInt(parts[3]);
            var tp = isNaN(tpRaw) ? 2 : tpRaw;
            var dist = parseInt(parts[4]) || 0;
            cumul += dur;

            var cls = (tp === 0) ? 'run' : (tp === 1) ? 'roxzone' : 'station';
            var isRun = (tp === 0);
            var pace = isRun ? fmtPace(dur, dist) : '—';
            var distStr = (isRun && dist > 0) ? (dist + 'm') : '—';

            html += '<tr>';
            html += '<td><span class="lap-name ' + cls + '">' + name + '</span></td>';
            html += '<td>' + fmt(dur) + '</td>';
            html += '<td class="lap-cumul">' + fmt(cumul) + '</td>';
            html += '<td class="lap-hr">' + (hr > 0 ? hr : '—') + '</td>';
            html += '<td class="lap-pace">' + pace + '</td>';
            html += '<td class="lap-dist">' + distStr + '</td>';
            html += '</tr>';
        }
        html += '</tbody></table>';
    }

    html += '<div class="actions">';
    html += '<button class="btn btn-primary" onclick="openShareModal()">Share Image</button>';
    html += '<button class="btn btn-secondary" onclick="doShare()">Share</button>';
    html += '</div>';

    html += '<div class="footer"><div class="footer-text">ROXTRACK</div></div>';

    el.innerHTML = html;

    // Store data for share image generation
    shareData = {
        total: fmt(t),
        warmup: fmt(w),
        run: fmt(r),
        station: fmt(s),
        roxzone: rz ? fmt(z) : null,
        pct: pct,
        avgPace: avgPaceStr,
        date: dateDisplay,
        avgHr: 0
    };
    // Compute avg HR from laps
    if (lapsStr) {
        var hrSum = 0, hrCount = 0;
        var hrLaps = lapsStr.split('|');
        for (var hi = 0; hi < hrLaps.length; hi++) {
            var hp = hrLaps[hi].split('^');
            var hv = parseInt(hp[2]) || 0;
            if (hv > 0) { hrSum += hv; hrCount++; }
        }
        if (hrCount > 0) shareData.avgHr = Math.round(hrSum / hrCount);
    }
}

function doShare() {
    if (navigator.share) {
        navigator.share({ title: 'RoxTrack Results', url: window.location.href });
    } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link copied to clipboard');
    }
}

// ── Share Image Modal ─────────────────────────────────────────────
function openShareModal() {
    document.getElementById('shareModal').classList.add('active');
    document.getElementById('raceNameInput').focus();
}
function closeShareModal() {
    document.getElementById('shareModal').classList.remove('active');
}

// ── Canvas Share Image Generator ──────────────────────────────────
function generateShareImage(mode) {
    if (!shareData) return;
    var raceName = document.getElementById('raceNameInput').value.trim();
    var canvas = document.getElementById('shareCanvas');
    var isStory = (mode === 'story');
    var W = 1080;
    var H = isStory ? 1920 : 1080;
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext('2d');

    // ── Colors ──
    var COL_BG      = '#0a0a0c';
    var COL_GOLD    = '#f5c518';
    var COL_WHITE   = '#f0f0f0';
    var COL_MUTED   = '#888888';
    var COL_DIM     = '#555555';
    var COL_SURFACE = 'rgba(255,255,255,0.04)';
    var COL_BORDER  = 'rgba(255,255,255,0.06)';
    var COL_RUN     = '#22c55e';
    var COL_STATION = '#f97316';
    var COL_PACE    = '#60a5fa';
    var COL_HR      = '#ef4444';

    // ── Background ──
    ctx.fillStyle = COL_BG;
    ctx.fillRect(0, 0, W, H);

    // ── Accent bar (top) ──
    var grad = ctx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, COL_GOLD);
    grad.addColorStop(0.5, '#f97316');
    grad.addColorStop(1, '#22c55e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, 6);

    // ── Helper: draw centered text ──
    function drawCenter(text, y, font, color) {
        ctx.font = font;
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.fillText(text, W / 2, y);
    }

    // ── Helper: draw rounded rect ──
    function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    // ── Helper: draw stat card ──
    function drawStatCard(x, y, w, h, label, value, color) {
        roundRect(x, y, w, h, 12);
        ctx.fillStyle = COL_SURFACE;
        ctx.fill();
        ctx.strokeStyle = COL_BORDER;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = '500 22px sans-serif';
        ctx.fillStyle = COL_MUTED;
        ctx.textAlign = 'center';
        ctx.letterSpacing = '3px';
        ctx.fillText(label.toUpperCase(), x + w / 2, y + 36);
        ctx.letterSpacing = '0px';

        ctx.font = '800 52px sans-serif';
        ctx.fillStyle = color;
        ctx.fillText(value, x + w / 2, y + h - 24);
    }

    if (isStory) {
        // ════════════════════════════════════════════════════════
        //  STORY LAYOUT — 1080 x 1920
        // ════════════════════════════════════════════════════════
        var cy = 160;

        // Brand
        ctx.font = '700 44px sans-serif';
        ctx.letterSpacing = '12px';
        drawCenter('ROXTRACK', cy, '700 44px sans-serif', COL_GOLD);
        ctx.letterSpacing = '0px';
        cy += 32;
        ctx.letterSpacing = '6px';
        drawCenter('RACE RESULTS', cy, '500 22px sans-serif', COL_DIM);
        ctx.letterSpacing = '0px';

        // Date
        if (shareData.date) {
            cy += 48;
            ctx.letterSpacing = '2px';
            drawCenter(shareData.date, cy, '400 24px sans-serif', COL_DIM);
            ctx.letterSpacing = '0px';
        }

        // Race name
        if (raceName) {
            cy += 80;
            ctx.letterSpacing = '3px';
            drawCenter(raceName.toUpperCase(), cy, '700 36px sans-serif', COL_WHITE);
            ctx.letterSpacing = '0px';
        }

        // Center section
        var centerY = isStory ? (raceName ? 620 : 560) : 400;

        // "Total Race Time" label
        ctx.letterSpacing = '6px';
        drawCenter('TOTAL RACE TIME', centerY, '500 26px sans-serif', COL_MUTED);
        ctx.letterSpacing = '0px';
        centerY += 80;

        // Big time
        drawCenter(shareData.total, centerY, '800 140px sans-serif', COL_GOLD);
        centerY += 24;

        // Distance pct
        if (shareData.pct !== 100) {
            centerY += 30;
            drawCenter(shareData.pct + '% Distance', centerY, '400 24px sans-serif', COL_DIM);
        }

        // Stat cards — 2x2 grid
        var cardW = 430;
        var cardH = 120;
        var cardGap = 24;
        var gridX = (W - cardW * 2 - cardGap) / 2;
        var gridY = centerY + 80;

        drawStatCard(gridX, gridY, cardW, cardH, 'Total Run', shareData.run, COL_RUN);
        drawStatCard(gridX + cardW + cardGap, gridY, cardW, cardH, 'Total Station', shareData.station, COL_STATION);
        drawStatCard(gridX, gridY + cardH + cardGap, cardW, cardH, 'Avg Run Pace', shareData.avgPace, COL_PACE);
        drawStatCard(gridX + cardW + cardGap, gridY + cardH + cardGap, cardW, cardH, 'Avg HR', shareData.avgHr > 0 ? String(shareData.avgHr) : '—', COL_HR);

        // Footer
        ctx.letterSpacing = '8px';
        drawCenter('ROXTRACK', H - 80, '500 20px sans-serif', '#333333');
        ctx.letterSpacing = '0px';

    } else {
        // ════════════════════════════════════════════════════════
        //  POST LAYOUT — 1080 x 1080
        // ════════════════════════════════════════════════════════

        // Header row — brand left, date right
        ctx.font = '700 40px sans-serif';
        ctx.fillStyle = COL_GOLD;
        ctx.textAlign = 'left';
        ctx.letterSpacing = '10px';
        ctx.fillText('ROXTRACK', 60, 80);
        ctx.letterSpacing = '0px';

        if (shareData.date) {
            // Shorten date for square format
            var shortDate = shareData.date.split('·')[0].trim();
            ctx.font = '400 24px sans-serif';
            ctx.fillStyle = COL_DIM;
            ctx.textAlign = 'right';
            ctx.fillText(shortDate, W - 60, 80);
        }

        // Race name
        var sqCenterY = raceName ? 220 : 200;
        if (raceName) {
            ctx.letterSpacing = '3px';
            drawCenter(raceName.toUpperCase(), 160, '700 34px sans-serif', COL_WHITE);
            ctx.letterSpacing = '0px';
        }

        // "Total Race Time" label
        ctx.letterSpacing = '6px';
        drawCenter('TOTAL RACE TIME', sqCenterY, '500 24px sans-serif', COL_MUTED);
        ctx.letterSpacing = '0px';

        // Big time
        drawCenter(shareData.total, sqCenterY + 80, '800 150px sans-serif', COL_GOLD);

        // Distance pct
        var afterTime = sqCenterY + 100;
        if (shareData.pct !== 100) {
            afterTime += 20;
            drawCenter(shareData.pct + '% Distance', afterTime, '400 24px sans-serif', COL_DIM);
        }

        // Stat cards — 2x2 grid
        var cW = 420;
        var cH = 110;
        var cGap = 20;
        var cX = (W - cW * 2 - cGap) / 2;
        var cY = raceName ? 540 : 500;

        drawStatCard(cX, cY, cW, cH, 'Total Run', shareData.run, COL_RUN);
        drawStatCard(cX + cW + cGap, cY, cW, cH, 'Total Station', shareData.station, COL_STATION);
        drawStatCard(cX, cY + cH + cGap, cW, cH, 'Avg Run Pace', shareData.avgPace, COL_PACE);
        drawStatCard(cX + cW + cGap, cY + cH + cGap, cW, cH, 'Avg HR', shareData.avgHr > 0 ? String(shareData.avgHr) : '—', COL_HR);

        // Footer
        ctx.letterSpacing = '8px';
        drawCenter('ROXTRACK', H - 50, '500 20px sans-serif', '#333333');
        ctx.letterSpacing = '0px';
    }

    // ── Download ──
    canvas.toBlob(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'roxtrack-' + mode + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        closeShareModal();
    }, 'image/png');
}

init();
</script>
</body>
</html>
